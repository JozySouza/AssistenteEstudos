services:
  - type: web
    name: assistente-estudos
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: node backend/src/server.js
    healthCheckPath: /saude
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
